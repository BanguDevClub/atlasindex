<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="50%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="50%" stop-color="#f5c2e7" />
      <stop offset="100%" stop-color="#fab387" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="150" r="250" fill="#89b4fa" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="480" r="280" fill="#fab387" opacity="0.1" filter="url(#glow)" />
  <circle cx="600" cy="300" r="300" fill="#cba6f7" opacity="0.06" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#cdd6f4" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="280" height="38" rx="19" fill="#89b4fa" fill-opacity="0.12" stroke="#89b4fa" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="24" cy="19" r="5" fill="#a6e3a1" />
    <text x="38" y="24" fill="#89b4fa" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1">2025 GLOBAL AUDIT RELEASE</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(80, 190)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#cdd6f4" letter-spacing="-1">
      Atlas<tspan fill="#89b4fa">Index</tspan>
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 260)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Global Median Wage &amp;
    </text>
    <text y="54" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" fill="url(#accent-gradient)" letter-spacing="-0.5">
      Food Purchasing Power Parity
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(80, 385)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a6adc8" font-weight="400">
      Measuring the real hours and minutes of labor needed to afford
    </text>
    <text y="28" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#a6adc8" font-weight="400">
      a standardized nutritional monthly food basket across 26 countries.
    </text>
  </g>

  <!-- Metric Badges Box (Right Side) -->
  <g transform="translate(760, 110)">
    <!-- Box 1: Switzerland -->
    <g transform="translate(0, 0)">
      <rect width="360" height="110" rx="16" fill="#181825" fill-opacity="0.8" stroke="#313244" stroke-width="1.5" />
      <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9399b2" letter-spacing="0.5">LOWEST LABOR BURDEN</text>
      <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#a6e3a1">9.3h / mo</text>
      <text x="180" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4">🇨🇭 Switzerland</text>
    </g>

    <!-- Box 2: Brazil / Median -->
    <g transform="translate(0, 130)">
      <rect width="360" height="110" rx="16" fill="#181825" fill-opacity="0.8" stroke="#313244" stroke-width="1.5" />
      <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9399b2" letter-spacing="0.5">DEVELOPING AVERAGE</text>
      <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f9e2af">52.4h / mo</text>
      <text x="200" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4">🇧🇷 Brazil</text>
    </g>

    <!-- Box 3: Egypt / High Stress -->
    <g transform="translate(0, 260)">
      <rect width="360" height="110" rx="16" fill="#181825" fill-opacity="0.8" stroke="#313244" stroke-width="1.5" />
      <text x="24" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#9399b2" letter-spacing="0.5">HIGH LABOR BURDEN</text>
      <text x="24" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="800" fill="#f38ba8">100.5h / mo</text>
      <text x="220" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#cdd6f4">🇪🇬 Egypt</text>
    </g>
  </g>

  <!-- Bottom Footer Bar -->
  <g transform="translate(80, 535)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#313244" stroke-width="1" />
    <text y="32" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a6adc8">
      Open Source Project by <tspan fill="#89b4fa">BanguDevClub</tspan> • Data: ILOSTAT, OECD, Eurostat, IBGE, BLS
    </text>
    <text x="1040" y="32" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#89b4fa">
      bangudevclub.github.io/atlasindex
    </text>
  </g>
</svg>
